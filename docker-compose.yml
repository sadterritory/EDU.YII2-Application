services:

  frontend:
    build: frontend
    ports:
      - 20081:80
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app
    environment:
      - DB_HOST = ${DB_HOST}
      - DB_USER = ${DB_USER}
      - DB_PASSWORD = ${DB_PASSWORD}
      - DB_NAME = ${DB_NAME}
    depends_on:
      - mysql

  backend:
    build: backend
    ports:
      - 21081:80
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app
    environment:
      - DB_HOST = ${DB_HOST}
      - DB_USER = ${DB_USER}
      - DB_PASSWORD = ${DB_PASSWORD}
      - DB_NAME = ${DB_NAME}
    depends_on:
      - mysql
  mysql:
    image: mysql:5.7
    environment:
      - MYSQL_ROOT_PASSWORD = ${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE = ${DB_NAME}
      - MYSQL_USER = ${DB_USER}
      - MYSQL_PASSWORD = ${DB_PASSWORD}
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8080:80
    environment:
      - PMA_HOST = ${DB_HOST}
      - PMA_USER = ${DB_USER}
      - PMA_PASSWORD = ${DB_PASSWORD}
    depends_on:
      - mysql